[project]
name = "blog-crud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.68",
    "pydantic>=2.12.5",
    "pytz>=2026.1.post1",
]

[dependency-groups]
dev = [
    "awscli-local>=0.22.2",
    "coverage>=7.13.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"